services:
  brew:
    image:
      tag: "26.11.19-09.18-73db76c" # CI pins this; keep the quotes and this exact nesting
    ports:
      - name: http
        containerPort: 3000
        servicePort: 80
        visibility: internet
    probes:
      port: http
      liveness:
        path: /healthz
      readiness:
        path: /readyz
    env:
      - name: ORIGIN
        value: https://brew.bybear.dk
