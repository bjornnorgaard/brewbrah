name: brew
on:
  push:
    paths: ['brew/**', '.github/workflows/brew.yml']
  pull_request:
    paths: ['brew/**']
defaults:
  run:
    working-directory: brew
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: brew/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run test:e2e
