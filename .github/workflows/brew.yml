name: brew
on:
  push:
    paths: ['brew/**', '.github/workflows/brew.yml']
  pull_request:
    paths: ['brew/**']
defaults:
  run:
    working-directory: brew
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: brew/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run test:e2e

  image:
    name: Build and push image
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The workflow-level default is brew/; these jobs use repo-root paths.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/brew
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: tag
        run: echo "value=$(bash .github/scripts/image-tag.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./brew
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=brew
          cache-to: type=gha,mode=max,scope=brew

  pin:
    name: Pin prod
    needs: [image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/pin-prod-and-push.sh brew "${{ needs.image.outputs.tag }}"
